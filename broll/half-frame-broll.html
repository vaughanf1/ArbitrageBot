<title>Arb Bot &#8212; Half-Frame B-Roll</title>
<style>
  :root{
    --ink:#04070E; --panel:#0B1322; --line:#1A2740; --line-hot:#2A3E64;
    --text:#EDF3FC; --dim:#7C90AE; --faint:#4E6084;
    --blue:#0A84FF; --blue-2:#5CB2FF;
    --green:#2FD35E; --amber:#FFA318; --red:#FF4F42;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,sans-serif;
  }
  html,body{height:100%;}
  body{background:#000;color:var(--text);font-family:var(--sans);overflow:hidden;}
  #fit{position:fixed;inset:0;}
  /* Top half of a 1080x1920 reel: the face sits in the other 960. */
  #stage{width:1080px;height:960px;position:absolute;top:50%;left:50%;transform-origin:center;overflow:hidden;
         background:radial-gradient(120% 90% at 50% 2%,#132444 0%,transparent 64%),
                    radial-gradient(90% 60% at 50% 100%,#0C1A2E 0%,transparent 62%),var(--ink);}

  .scene{position:absolute;inset:0;display:none;} .scene.on{display:block;}

  .cap{position:absolute;left:0;right:0;text-align:center;font-size:54px;font-weight:680;
       letter-spacing:-.032em;line-height:1.06;}
  .cap.bot{bottom:46px;} .cap.top{top:52px;}
  .cap .g{color:var(--faint);}
  .tag{position:absolute;left:0;right:0;text-align:center;font-family:var(--mono);font-size:20px;
       letter-spacing:.32em;text-transform:uppercase;color:var(--faint);}
  .huge{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.05em;
        position:absolute;left:0;right:0;text-align:center;}
  svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}

  /* 01 hook */
  .hooktag{position:absolute;left:70px;top:236px;font-family:var(--mono);font-size:20px;
           letter-spacing:.3em;text-transform:uppercase;color:var(--blue);}
  .hookbig{position:absolute;left:70px;right:70px;top:50%;transform:translateY(-50%);
           font-size:62px;font-weight:700;letter-spacing:-.04em;line-height:1.06;}
  .hookbig span{display:inline-block;opacity:0;}
  .hookbig .g{color:var(--faint);}

  /* 02 tree */
  .tn{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;opacity:0;
      font-family:var(--mono);font-size:21px;padding:9px 16px;border:1px solid var(--line-hot);
      border-radius:30px;background:#0A1424;}
  .tn.root{font-size:26px;padding:12px 22px;background:linear-gradient(180deg,#15294B,#0C1729);}
  .tn.leaf{color:var(--dim);font-size:19px;padding:8px 14px;}

  /* 03 triangle */
  .vc{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;
      border:2px solid var(--line-hot);background:#0A1424;display:grid;place-items:center;
      font-family:var(--mono);font-size:22px;color:var(--dim);}

  /* 04 book */
  .bk{position:absolute;left:110px;right:110px;height:46px;display:flex;align-items:center;gap:18px;opacity:0;}
  .bk .pz{font-family:var(--mono);font-size:25px;width:110px;color:var(--dim);}
  .bk .bz{flex:1;height:26px;border-radius:6px;background:#132340;position:relative;overflow:hidden;}
  .bk .bz i{position:absolute;inset:0 auto 0 0;display:block;background:linear-gradient(90deg,#1B4B7E,#2C8CF0);}
  .bk.eaten .pz{color:var(--faint);}
  .bk.eaten .bz i{background:linear-gradient(90deg,#3A2A1A,#7A5418);}

  /* 05 pair */
  .pc{position:absolute;width:372px;border-radius:22px;border:2px solid var(--line);background:var(--panel);
      padding:26px 26px 28px;opacity:0;}
  .pc .vn{font-family:var(--mono);font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue-2);}
  .pc .sd{font-family:var(--mono);font-size:18px;letter-spacing:.18em;color:var(--faint);margin-top:22px;}
  .pc .pp{font-family:var(--mono);font-size:84px;letter-spacing:-.045em;line-height:1;margin-top:4px;}

  /* 06 fill */
  .lg{position:absolute;left:110px;right:110px;height:64px;border-radius:14px;border:2px solid var(--line);
      background:var(--panel);display:flex;align-items:center;justify-content:space-between;
      padding:0 26px;font-family:var(--mono);font-size:25px;color:var(--dim);opacity:0;}
  .lg.done{border-color:rgba(47,211,94,.55);background:rgba(47,211,94,.09);color:var(--text);}
  .lg .ck{color:var(--green);font-size:28px;opacity:0;} .lg.done .ck{opacity:1;}

  /* 07 fees */
  .fbar{position:absolute;left:110px;right:110px;top:186px;height:84px;border-radius:12px;
        background:#0A1120;border:2px solid var(--line);overflow:hidden;}
  .fgross{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#12563A,#2FD35E);}
  .ffee{position:absolute;top:0;bottom:0;width:0;background:#C0362B;border-left:2px solid rgba(255,255,255,.25);}

  /* 08 caps */
  .cb{position:absolute;left:120px;right:120px;height:20px;border-radius:10px;background:#0A1120;
      border:1px solid var(--line);overflow:hidden;opacity:0;}
  .cb i{position:absolute;inset:0 auto 0 0;width:0;display:block;background:linear-gradient(90deg,#124A85,#2C8CF0);}
  .cl{position:absolute;left:120px;font-family:var(--mono);font-size:20px;color:var(--faint);
      letter-spacing:.16em;text-transform:uppercase;opacity:0;}
  .sw{position:absolute;left:50%;transform:translateX(-50%);width:280px;height:132px;border-radius:66px;
      background:#0C1526;border:2px solid var(--line-hot);transition:background .2s,border-color .2s,box-shadow .2s;}
  .sw .k{position:absolute;top:10px;left:10px;width:108px;height:108px;border-radius:50%;background:#2D4160;
         transition:left .28s cubic-bezier(.5,0,.15,1),background .28s;}
  .sw.on{background:rgba(255,79,66,.2);border-color:var(--red);box-shadow:0 0 70px -10px rgba(255,79,66,.9);}
  .sw.on .k{left:162px;background:var(--red);}

  /* 09 gates */
  .gt{position:absolute;left:170px;right:90px;height:64px;border-radius:14px;border:2px solid var(--line);
      background:var(--panel);display:flex;align-items:center;padding:0 26px;
      font-family:var(--mono);font-size:26px;color:var(--dim);}
  .gt.ok{border-color:rgba(47,211,94,.5);background:rgba(47,211,94,.07);color:var(--text);}
  .gt.no{border-color:rgba(255,79,66,.65);background:rgba(255,79,66,.13);color:#FF9086;}
  .gt.now{border-color:var(--blue);background:rgba(10,132,255,.12);color:var(--text);}
  .gtok{position:absolute;left:96px;width:26px;height:26px;border-radius:50%;background:var(--blue-2);
        box-shadow:0 0 26px rgba(92,178,255,1);opacity:0;}
  .gspine{position:absolute;left:108px;top:70px;height:530px;width:2px;background:#182741;}

  /* 11 nothing */
  .rr{position:absolute;left:110px;right:110px;height:62px;border-radius:12px;border:1px solid var(--line);
      background:var(--panel);display:flex;align-items:center;justify-content:space-between;
      padding:0 26px;font-family:var(--mono);font-size:24px;opacity:0;}
  .rr .x{color:var(--faint);} .rr b{font-weight:400;}
  .strike{position:absolute;left:26px;height:2px;background:var(--red);width:0;top:50%;
          box-shadow:0 0 10px rgba(255,79,66,.9);}

  /* 12 paper */
  .pb{position:absolute;left:130px;right:130px;border-radius:16px;border:2px solid var(--line);
      background:var(--panel);padding:20px 24px;opacity:0;}
  .pb .t{font-family:var(--mono);font-size:26px;}
  .pb .s{font-size:19px;color:var(--faint);margin-top:6px;}
  .pb.a{border-color:rgba(47,211,94,.45);} .pb.c{border-color:rgba(255,163,24,.45);}
  .tape{font-family:var(--mono);font-size:21px;color:var(--green);line-height:1.5;margin-top:10px;height:96px;overflow:hidden;}

  /* chrome */
  #rail{position:absolute;left:50px;right:50px;bottom:16px;display:flex;gap:7px;transition:opacity .3s;}
  .chip{flex:1;height:6px;border-radius:3px;background:#131F35;overflow:hidden;cursor:pointer;}
  .chip i{display:block;height:100%;width:0;background:var(--blue);}
  body.bare #rail{opacity:0;pointer-events:none;}
</style>

<div id="fit"><div id="stage">

  <section class="scene" id="s1"><div class="hooktag" id="hktag"></div><div class="hookbig" id="hkline"></div></section>

  <section class="scene" id="s2"><svg id="t2svg"></svg><div id="t2"></div><div class="cap bot" id="c2"></div></section>

  <section class="scene" id="s3">
    <svg id="t3svg"></svg><div id="t3"></div>
    <div class="huge" id="n3" style="top:534px;font-size:104px;"></div>
    <div class="tag" id="g3" style="top:660px;"></div>
    <div class="cap bot" id="c3"></div>
  </section>

  <section class="scene" id="s4">
    <div id="r4"></div>
    <div class="huge" id="n4" style="top:466px;font-size:98px;"></div>
    <div class="tag" id="g4" style="top:588px;"></div>
    <div class="cap bot" id="c4"></div>
  </section>

  <section class="scene" id="s5">
    <div class="pc" id="p5a" style="left:110px;top:108px;">
      <div class="vn">Polymarket</div><div class="sd">BUY YES</div><div class="pp">.54</div></div>
    <div class="pc" id="p5b" style="right:110px;top:108px;">
      <div class="vn">Kalshi</div><div class="sd">BUY NO</div><div class="pp">.43</div></div>
    <div class="huge" id="n5" style="top:412px;font-size:146px;opacity:0;"></div>
    <div class="tag" id="g5" style="top:588px;opacity:0;"></div>
    <div class="cap bot" id="c5"></div>
  </section>

  <section class="scene" id="s6">
    <div id="r6"></div>
    <div class="huge" id="n6" style="top:446px;font-size:128px;"></div>
    <div class="tag" id="g6" style="top:600px;"></div>
    <div class="cap bot" id="c6"></div>
  </section>

  <section class="scene" id="s7">
    <div class="tag" id="g7a" style="top:132px;">gross edge</div>
    <div class="fbar"><div class="fgross" id="f7"></div></div>
    <div class="huge" id="n7" style="top:326px;font-size:120px;"></div>
    <div class="tag" id="g7" style="top:470px;"></div>
    <div class="cap bot" id="c7"></div>
  </section>

  <section class="scene" id="s8">
    <div id="r8"></div>
    <div class="sw" id="sw8" style="top:452px;"><div class="k"></div></div>
    <div class="cap bot" id="c8"></div>
  </section>

  <section class="scene" id="s9">
    <div class="gspine"></div><div id="r9"></div><div class="gtok" id="tok9"></div>
    <div class="cap bot" id="c9"></div>
  </section>

  <section class="scene" id="s10">
    <div class="huge" id="n10" style="top:148px;font-size:172px;line-height:.9;"></div>
    <div class="tag" id="g10" style="top:378px;"></div>
    <div class="cb" id="b10" style="top:442px;opacity:1;"><i></i></div>
    <div class="cap bot" id="c10"></div>
  </section>

  <section class="scene" id="s11">
    <div class="cap top" id="c11"></div>
    <div id="r11"></div>
    <div class="huge" id="n11" style="top:498px;font-size:190px;line-height:.9;"></div>
    <div class="tag" id="g11" style="top:730px;"></div>
  </section>

  <section class="scene" id="s12">
    <svg id="t12svg"></svg>
    <div class="pb a" id="b12a" style="top:86px;">
      <div class="t">Live market tape</div><div class="s">real books, polled every 5s</div><div class="tape"></div></div>
    <div class="pb" id="b12b" style="top:340px;"><div class="t">Engine</div><div class="s">same code path as live</div></div>
    <div class="pb c" id="b12c" style="top:496px;"><div class="t">Simulated fill</div><div class="s">priced against that tape</div></div>
    <div class="cap bot" id="c12"></div>
  </section>

  <div id="rail"></div>
</div></div>

<script>
(() => {
  const $=s=>document.querySelector(s), SVGNS="http://www.w3.org/2000/svg";
  const stage=$("#stage"), reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fit=()=>stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1080, innerHeight/960)})`;
  addEventListener("resize",fit); fit();

  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const win=(p,a,b)=>clamp((p-a)/(b-a),0,1);
  const out=t=>1-Math.pow(1-t,3);
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const back=t=>{const c=2.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
  const mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

  /* 01 hook */
  const S1=(()=>{
    const H=[["Hook A","Every arbitrage bot on Instagram","is lying to you."],
             ["Hook B","It finds free money.","Most days it finds nothing."],
             ["Hook C","Arbitrage is real.","What they sell you is not."]];
    const tag=$("#hktag"), line=$("#hkline"); let shown=-1, words=[];
    return {len:13.5, update(p){
      const i=clamp(Math.floor(p/4.5),0,H.length-1), local=p-i*4.5;
      if(i!==shown){
        shown=i; tag.textContent=H[i][0]; line.innerHTML=""; words=[];
        [[H[i][1],""],[H[i][2],"g"]].forEach(([txt,cls],part)=>{
          txt.split(" ").forEach(w=>{const e=mk("span",cls,w+"&nbsp;");line.appendChild(e);words.push(e);});
          if(part===0) line.appendChild(mk("br"));
        });
      }
      words.forEach((w,k)=>{const a=.35+k*.11, t=out(win(local,a,a+.42));
        w.style.opacity=t; w.style.transform=`translateY(${(1-t)*20}px)`;});
      tag.style.opacity=out(win(local,.05,.4));
    }};
  })();

  /* 02 tree */
  const S2=(()=>{
    const T={t:"ARB ENGINE",x:540,y:126,c:[
      {t:"SCAN",x:200,y:376,c:[{t:"triangular",x:106,y:626},{t:"pairs",x:300,y:626}]},
      {t:"RISK",x:540,y:376,c:[{t:"caps",x:446,y:626},{t:"kill",x:634,y:626}]},
      {t:"EXECUTE",x:880,y:376,c:[{t:"paper",x:786,y:626},{t:"live",x:974,y:626}]}]};
    const host=$("#t2"), svg=$("#t2svg"), all=[];
    (function place(n,parent,d){
      n.d=d;
      const el=mk("div","tn"+(d===0?" root":d===2?" leaf":""),n.t);
      el.style.left=n.x+"px"; el.style.top=n.y+"px"; host.appendChild(el); n.el=el; all.push(n);
      if(parent){
        const q=document.createElementNS(SVGNS,"path"), my=(parent.y+n.y)/2;
        q.setAttribute("d",`M ${parent.x} ${parent.y} C ${parent.x} ${my}, ${n.x} ${my}, ${n.x} ${n.y}`);
        q.setAttribute("fill","none"); q.setAttribute("stroke","#22355A"); q.setAttribute("stroke-width","2.5");
        svg.appendChild(q); n.edge=q; n.len=q.getTotalLength();
        q.style.strokeDasharray=n.len; q.style.strokeDashoffset=n.len;
        const c=document.createElementNS(SVGNS,"circle");
        c.setAttribute("r","6"); c.setAttribute("fill","#5CB2FF");
        c.setAttribute("filter","drop-shadow(0 0 12px rgba(92,178,255,1))"); c.style.opacity=0;
        svg.appendChild(c); n.spark=c;
      }
      (n.c||[]).forEach(k=>place(k,n,d+1));
    })(T,null,0);
    return {len:9, update(p){
      for(const n of all){
        const a=.35+n.d*1.3, k=out(win(p,a,a+.7));
        n.el.style.opacity=k;
        n.el.style.transform=`translate(-50%,-50%) scale(${.88+.12*back(clamp(k,0,1))})`;
        if(n.edge){
          const e=out(win(p,a-.75,a+.15));
          n.edge.style.strokeDashoffset=n.len*(1-e);
          const live=e>0&&e<1; n.spark.style.opacity=live?1:0;
          if(live){const pt=n.edge.getPointAtLength(n.len*e);n.spark.setAttribute("cx",pt.x);n.spark.setAttribute("cy",pt.y);}
        }
      }
      $("#c2").innerHTML = p>5.1 ? 'ONE ENGINE. <span class="g">EVERY CHECK IN CODE.</span>' : "";
      $("#c2").style.opacity=out(win(p,5.1,5.8));
    }};
  })();

  /* 03 triangle */
  const S3=(()=>{
    const svg=$("#t3svg"), host=$("#t3");
    const V=[[540,112],[878,448],[202,448]], N=["USDT","BTC","ETH"];
    const d=`M ${V[0][0]} ${V[0][1]} L ${V[1][0]} ${V[1][1]} L ${V[2][0]} ${V[2][1]} Z`;
    const tri=document.createElementNS(SVGNS,"path");
    tri.setAttribute("d",d);tri.setAttribute("fill","none");tri.setAttribute("stroke","#1C2B47");tri.setAttribute("stroke-width","3");
    svg.appendChild(tri);
    const glow=document.createElementNS(SVGNS,"path");
    glow.setAttribute("d",d);glow.setAttribute("fill","none");glow.setAttribute("stroke","#0A84FF");
    glow.setAttribute("stroke-width","6");glow.setAttribute("stroke-linecap","round");svg.appendChild(glow);
    const L=glow.getTotalLength(); glow.style.strokeDasharray=`${L*.2} ${L}`;
    const dot=document.createElementNS(SVGNS,"circle");
    dot.setAttribute("r","13");dot.setAttribute("fill","#8CC8FF");
    dot.setAttribute("filter","drop-shadow(0 0 20px rgba(92,178,255,1))");svg.appendChild(dot);
    const circles=V.map(([x,y],i)=>{const e=mk("div","vc",N[i]);e.style.left=x+"px";e.style.top=y+"px";host.appendChild(e);return e;});
    return {len:9, update(p){
      const lap=(p/2.6)%1;
      glow.style.strokeDashoffset=-L*lap;
      const pt=glow.getPointAtLength(L*lap);
      dot.setAttribute("cx",pt.x);dot.setAttribute("cy",pt.y);
      circles.forEach((c,i)=>{const n=Math.abs(((lap-i/3)+1)%1), hot=n<.11||n>.92;
        c.style.borderColor=hot?"var(--blue)":"var(--line-hot)";
        c.style.color=hot?"var(--text)":"var(--dim)";
        c.style.boxShadow=hot?"0 0 44px -6px rgba(10,132,255,.95)":"none";});
      const dead=p>5.4, v=0.311*out(win(p,1.0,2.6));
      $("#n3").textContent = dead ? "+0.011%" : "+"+v.toFixed(3)+"%";
      $("#n3").style.color = dead ? "var(--amber)" : "var(--text)";
      $("#g3").textContent = p<3.0 ? "" : dead ? "after fees" : "gross spread";
      $("#c3").innerHTML = dead ? 'NOT ENOUGH. <span class="g">NO TRADE.</span>' : "";
      $("#c3").style.opacity=out(win(p,5.6,6.3));
    }};
  })();

  /* 04 order book */
  const S4=(()=>{
    const L=[[".152",1],[".154",.62],[".157",.44],[".161",.30],[".166",.22],[".173",.15],[".182",.10]];
    const rows=L.map(([pz,sz],i)=>{
      const d=mk("div","bk",`<span class="pz">${pz}</span><span class="bz"><i style="width:${sz*100}%"></i></span>`);
      d.style.top=(104+i*52)+"px"; $("#r4").appendChild(d); return d;});
    return {len:10, update(p){
      const eat=win(p,1.6,5.4)*L.length;
      rows.forEach((r,i)=>{r.style.opacity=out(win(p,.3+i*.16,.9+i*.16)); r.classList.toggle("eaten",eat>i+.8);});
      const taken=clamp(Math.floor(eat),0,L.length);
      let cost=0,qty=0; for(let i=0;i<taken;i++){cost+=parseFloat(L[i][0])*L[i][1];qty+=L[i][1];}
      $("#n4").textContent = qty>0 ? "$"+(cost/qty).toFixed(3) : "$0.152";
      $("#n4").style.color = taken>3 ? "var(--amber)" : "var(--text)";
      $("#g4").textContent = p>1.6 ? "average price paid" : "best ask";
      $("#c4").innerHTML = p>6.2 ? 'SIZE MOVES <span class="g">THE PRICE.</span>' : "";
      $("#c4").style.opacity=out(win(p,6.2,6.9));
    }};
  })();

  /* 05 pair */
  const S5=(()=>{
    const a=$("#p5a"),b=$("#p5b"),n=$("#n5"),g=$("#g5"),c=$("#c5");
    return {len:9, update(p){
      const ka=out(win(p,.35,1.25)), kb=out(win(p,.75,1.65));
      a.style.opacity=ka; a.style.transform=`translateX(${(1-ka)*-120}px)`;
      b.style.opacity=kb; b.style.transform=`translateX(${(1-kb)*120}px)`;
      const s=out(win(p,2.2,3.0));
      n.style.opacity=s; n.style.transform=`scale(${.72+.28*back(clamp(s,0,1))})`;
      n.textContent="$0.97"; n.style.color = p>3.6 ? "var(--green)" : "var(--text)";
      g.style.opacity=out(win(p,3.6,4.2)); g.textContent="pays $1.00 either way";
      c.innerHTML = p>5.2 ? 'BUY BOTH SIDES. <span class="g">KEEP THE GAP.</span>' : "";
      c.style.opacity=out(win(p,5.2,5.9));
    }};
  })();

  /* 06 fill */
  const S6=(()=>{
    const L=[["Eagles",".30"],["Cowboys",".26"],["Commanders",".18"],["Giants",".16"]];
    const rows=L.map(([n,pz],i)=>{
      const d=mk("div","lg",`<span>${n}</span><span>${pz}<span class="ck">&nbsp;&#10003;</span></span>`);
      d.style.top=(104+i*76)+"px"; $("#r6").appendChild(d); return d;});
    return {len:10, update(p){
      rows.forEach((r,i)=>{const a=.4+i*.28, k=out(win(p,a,a+.4));
        r.style.opacity=k; r.style.transform=`translateX(${(1-k)*-30}px)`;
        r.classList.toggle("done",p>a+.85);});
      const f=out(win(p,3.2,4.0)), n=$("#n6");
      n.textContent="+$5.89"; n.style.opacity=f; n.style.color="var(--green)";
      n.style.transform=`scale(${.68+.32*back(clamp(f,0,1))})`;
      $("#g6").textContent = p>4.0 ? "locked, whoever wins" : "";
      $("#g6").style.opacity=out(win(p,4.0,4.6));
      $("#c6").innerHTML = p>5.6 ? 'A DOLLAR OF PAYOFF <span class="g">FOR NINETY CENTS.</span>' : "";
      $("#c6").style.opacity=out(win(p,5.6,6.3));
    }};
  })();

  /* 07 fees */
  const S7=(()=>{
    const LEGS=[.36,.34,.15,.13], cost=LEGS.reduce((a,b)=>a+b,0);
    const gross=(1-cost)/cost*100, fees=LEGS.map(x=>(.06*x*(1-x))/cost*100), SCALE=5.0;
    const bar=$(".fbar"), g=$("#f7");
    const blocks=fees.map(()=>{const b=mk("div","ffee");bar.appendChild(b);return b;});
    return {len:10, update(p){
      const gw=out(win(p,.4,1.4))*(gross/SCALE)*100; g.style.width=gw+"%";
      let acc=0,paid=0;
      fees.forEach((f,i)=>{const w=(f/SCALE)*100, k=out(win(p,2.0+i*.5,2.6+i*.5));
        blocks[i].style.left=Math.max(0,gw-acc-w*k)+"%"; blocks[i].style.width=w*k+"%";
        acc+=w*k; paid+=f*k;});
      const net=gross-paid;
      $("#n7").textContent=(net>0?"+":"")+net.toFixed(2)+"%";
      $("#n7").style.color = p<2.0 ? "var(--green)" : net>0 ? "var(--text)" : "var(--red)";
      $("#g7").textContent = p<2.0 ? "" : p<4.6 ? "minus fees, four legs" : "guaranteed loss";
      $("#c7").innerHTML = p>6.0 ? 'FOUR LEGS. <span class="g">FOUR COMMISSIONS.</span>' : "";
      $("#c7").style.opacity=out(win(p,6.0,6.7));
    }};
  })();

  /* 08 caps */
  const S8=(()=>{
    const C=[["trade size",.22],["daily exposure",1],["trailing stop",.4],["daily loss",.4]];
    const bars=C.map(([n,w],i)=>{
      const l=mk("div","cl",n); l.style.top=(104+i*78)+"px"; $("#r8").appendChild(l);
      const b=mk("div","cb",'<i></i>'); b.style.top=(140+i*78)+"px"; $("#r8").appendChild(b);
      return {l,b,f:b.querySelector("i"),w};});
    const sw=$("#sw8");
    return {len:9, update(p){
      bars.forEach((r,i)=>{const k=out(win(p,.3+i*.32,1.1+i*.32));
        r.l.style.opacity=k*.9; r.b.style.opacity=k; r.f.style.width=(r.w*100*k)+"%";});
      sw.classList.toggle("on", p>3.4&&p<7.4);
      $("#c8").innerHTML = p>4.0 ? 'HARD CAPS. <span class="g">NOT SUGGESTIONS.</span>' : "";
      $("#c8").style.opacity=out(win(p,4.0,4.7));
    }};
  })();

  /* 09 gates */
  const S9=(()=>{
    const G=["routing","paper","risk","dedupe","held","cash"], TOP=96, H=78;
    const rows=G.map((g,i)=>{const d=mk("div","gt",g);d.style.top=(TOP+i*H)+"px";$("#r9").appendChild(d);return d;});
    const tok=$("#tok9"), RUNS=[{t0:.5,die:3},{t0:5.0,die:5},{t0:9.4,die:-1}], DWELL=.5;
    return {len:15, update(p){
      rows.forEach(r=>r.className="gt");
      let act=null;
      for(const r of RUNS){const stops=r.die<0?G.length:r.die+1, end=r.t0+stops*DWELL;
        if(p>=r.t0&&p<end+1.4) act={r,stops,end};}
      if(!act){tok.style.opacity=0;$("#c9").style.opacity=0;return;}
      const {r,stops,end}=act;
      const idx=clamp(Math.floor((p-r.t0)/DWELL),0,stops-1), sub=((p-r.t0)/DWELL)%1, done=p>=end;
      for(let i=0;i<idx;i++) rows[i].className="gt ok";
      if(done&&r.die>=0) rows[idx].className="gt no";
      else if(done) rows.forEach(x=>x.className="gt ok");
      else rows[idx].className="gt now";
      const to=TOP+idx*H+H/2-21, from=idx>0?TOP+(idx-1)*H+H/2-21:TOP-70;
      tok.style.top=(done?to:from+(to-from)*ease(clamp(sub*1.7,0,1)))+"px";
      const burst=win(p,end,end+.45);
      tok.style.opacity = done&&r.die>=0 ? 1-burst : 1;
      tok.style.transform=`scale(${1+burst*(r.die>=0?2.2:1.8)})`;
      tok.style.background = done ? (r.die>=0?"var(--red)":"var(--green)") : "var(--blue-2)";
      tok.style.boxShadow=`0 0 ${26+burst*40}px ${done?(r.die>=0?"rgba(255,79,66,1)":"rgba(47,211,94,1)"):"rgba(92,178,255,1)"}`;
      $("#c9").innerHTML = r.die<0 ? 'ALL SIX CLEAR. <span class="g">THAT ONE FIRES.</span>'
                                   : 'SIX CHECKS. <span class="g">ANY ONE KILLS IT.</span>';
      $("#c9").style.opacity=out(win(p,end,end+.5));
    }};
  })();

  /* 10 funnel */
  const S10=(()=>{
    const STEP=[[1284,"markets polled",1],[312,"baskets grouped",.24],[38,"fully priced",.03],
                [2,"cleared the edge",.0016],[0,"fired today",0]];
    const n=$("#n10"), l=$("#g10"), bar=$("#b10").querySelector("i");
    return {len:11, update(p){
      const i=clamp(Math.floor(win(p,.4,9.4)*STEP.length),0,STEP.length-1);
      const [v,lab,w]=STEP[i], local=(p-.4-i*1.8)/1.2, prev=i>0?STEP[i-1][0]:0, k=out(clamp(local,0,1));
      n.textContent=Math.round(prev+(v-prev)*k).toLocaleString();
      n.style.color = i===STEP.length-1 ? "var(--red)" : i===0 ? "var(--text)" : "var(--blue-2)";
      l.textContent=lab;
      const pw=i>0?STEP[i-1][2]:1;
      bar.style.width=((pw+(w-pw)*k)*100)+"%";
      bar.style.background = i>=3 ? "linear-gradient(90deg,#5A1E19,#C0362B)" : "linear-gradient(90deg,#124A85,#2C8CF0)";
      $("#c10").innerHTML = p>8.4 ? 'A THOUSAND IN. <span class="g">NONE OUT.</span>' : "";
      $("#c10").style.opacity=out(win(p,8.4,9.1));
    }};
  })();

  /* 11 nothing */
  const S11=(()=>{
    const R=[["BTC / ETH loop","0.31%"],["Fed cuts","0.42%"],["SOL / ETH loop","0.18%"],["Super Bowl","0.61%"]];
    const rows=R.map(([n,e],i)=>{
      const d=mk("div","rr",`<span class="x">${n}</span><b>${e}</b><span class="strike"></span>`);
      d.style.top=(196+i*76)+"px"; $("#r11").appendChild(d);
      return {d,s:d.querySelector(".strike")};});
    return {len:10, update(p){
      rows.forEach((r,i)=>{const a=.3+i*.5, k=out(win(p,a,a+.42));
        r.d.style.opacity=k; r.d.style.transform=`translateX(${(1-k)*-30}px)`;
        const st=out(win(p,a+.55,a+1.05));
        r.s.style.width=`calc((100% - 52px) * ${st})`;
        r.d.style.borderColor = st>.9 ? "rgba(255,79,66,.35)" : "var(--line)";
        r.d.style.opacity = st>.9 ? .55 : k;});
      const z=out(win(p,3.6,4.4)), n=$("#n11");
      n.textContent="0"; n.style.opacity=z; n.style.transform=`scale(${.62+.38*back(clamp(z,0,1))})`;
      $("#g11").textContent = p>4.4 ? "qualifying today" : "";
      $("#g11").style.opacity=out(win(p,4.4,5.0));
      $("#c11").innerHTML = p>6.0 ? 'MOST DAYS <span class="g">IT FINDS NOTHING.</span>' : "";
      $("#c11").style.opacity=out(win(p,6.0,6.7));
    }};
  })();

  /* 12 paper */
  const S12=(()=>{
    const svg=$("#t12svg"), b=[$("#b12a"),$("#b12b"),$("#b12c")];
    const wires=[[540,282,540,340],[540,436,540,496]].map(([x1,y1,x2,y2])=>{
      const p=document.createElementNS(SVGNS,"path");
      p.setAttribute("d",`M ${x1} ${y1} L ${x2} ${y2}`);
      p.setAttribute("stroke","#22355A");p.setAttribute("stroke-width","2.5");p.setAttribute("fill","none");
      svg.appendChild(p); return p;});
    const dots=wires.map(()=>{const c=document.createElementNS(SVGNS,"circle");
      c.setAttribute("r","7");c.setAttribute("fill","#5CB2FF");
      c.setAttribute("filter","drop-shadow(0 0 13px rgba(92,178,255,1))");svg.appendChild(c);return c;});
    const T=["BTC 96,412.20","ETH 3,648.91","SOL 214.06","BTC 96,415.10","ETH 3,649.40"];
    return {len:9, update(p){
      b.forEach((x,i)=>x.style.opacity=out(win(p,.3+i*.55,1.0+i*.55)));
      dots.forEach((c,i)=>{const k=((p*.6)+i*.5)%1, y1=i?436:282, y2=i?496:340;
        c.setAttribute("cx",540); c.setAttribute("cy",y1+(y2-y1)*k);
        c.style.opacity = p>1.1+i*.55 ? 1 : 0;});
      const tape=$("#s12 .tape"), n=Math.floor(p*3)%T.length;
      tape.innerHTML=[0,1,2].map(k=>T[(n+k)%T.length]).join("<br>");
      $("#c12").innerHTML = p>4.6 ? 'REAL PRICES. <span class="g">NO MONEY AT RISK.</span>' : "";
      $("#c12").style.opacity=out(win(p,4.6,5.3));
    }};
  })();

  /* director */
  const SC=[{id:"s1",s:S1},{id:"s2",s:S2},{id:"s3",s:S3},{id:"s4",s:S4},{id:"s5",s:S5},{id:"s6",s:S6},
            {id:"s7",s:S7},{id:"s8",s:S8},{id:"s9",s:S9},{id:"s10",s:S10},{id:"s11",s:S11},{id:"s12",s:S12}];
  const rail=$("#rail");
  SC.forEach((sc,i)=>{const c=mk("div","chip","<i></i>");c.onclick=()=>go(i);rail.appendChild(c);sc.bar=c.querySelector("i");});
  let cur=0,phase=0,last=performance.now(),paused=false,loops=0;
  function go(i){
    document.getElementById(SC[cur].id).classList.remove("on");
    cur=(i+SC.length)%SC.length; phase=0; loops=0;
    document.getElementById(SC[cur].id).classList.add("on");
    SC[cur].s.update(0);
  }
  function frame(now){
    const dt=(now-last)/1000; last=now;
    if(!paused){
      phase+=dt;
      const sc=SC[cur];
      if(phase>=sc.s.len){ phase-=sc.s.len; if(++loops>=2){ go(cur+1); requestAnimationFrame(frame); return; } }
      sc.s.update(phase);
      SC.forEach((s,i)=>s.bar.style.width = i===cur ? (phase/s.s.len*100)+"%" : "0%");
    }
    requestAnimationFrame(frame);
  }
  addEventListener("keydown",e=>{
    if(e.key>="1"&&e.key<="9") go(+e.key-1);
    else if(e.key==="0") go(9);
    else if(e.key==="ArrowRight") go(cur+1);
    else if(e.key==="ArrowLeft") go(cur-1);
    else if(e.key===" "){e.preventDefault();paused=!paused;}
    else if(e.key.toLowerCase()==="h") document.body.classList.toggle("bare");
  });
  window.__broll={go,
    seek(i,p){paused=true; if(cur!==i){go(i);} phase=p; SC[i].s.update(p);},
    lens(){return SC.map(x=>x.s.len);},
    names(){return SC.map(x=>x.id);}};
  go(0);
  if(reduced) SC.forEach(s=>s.s.update(s.s.len*.8)); else requestAnimationFrame(frame);
})();
</script>
